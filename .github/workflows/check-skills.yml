name: Check Skills

on:
  pull_request: {}
  release:
    types: [published]
  workflow_dispatch: {}

permissions: {}

jobs:
  skills:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.20.0'
          cache: pnpm
      - name: Install locked tooling without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build the packages whose examples are checked
        run: pnpm exec turbo run build --filter=vite-plugin-zephyr --filter=create-zephyr-apps
      - name: Check guidance and recorded source reviews
        if: github.event_name == 'pull_request'
        env:
          REVIEW_BASE: ${{ github.event.pull_request.base.sha }}
        run: pnpm skills:check --base "$REVIEW_BASE" --github-summary
      - name: Produce a read-only review report
        if: github.event_name != 'pull_request'
        run: pnpm --silent skills:review --json > "$RUNNER_TEMP/intent-review.json"
      - name: Save the review report
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: intent-review
          path: ${{ runner.temp }}/intent-review.json
          retention-days: 7
