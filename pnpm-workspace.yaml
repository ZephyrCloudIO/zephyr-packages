# Fails if trusted package stops being trusted
trustPolicy: no-downgrade
# Ignores trust policies for packages older than a week
trustPolicyIgnoreAfter: 10080
# Minimum of 1 day before released packages can be installed
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@lynx-js/cache-events-webpack-plugin@0.2.1'
  - '@lynx-js/chunk-loading-webpack-plugin@0.4.2'
  - '@lynx-js/debug-metadata-rsbuild-plugin@0.2.2'
  - '@lynx-js/qrcode-rsbuild-plugin@0.7.0'
  - '@lynx-js/rsbuild-plugin@0.1.0'
  - '@lynx-js/rspeedy@0.17.0'
  - '@lynx-js/template-webpack-plugin@0.16.0'
  - '@lynx-js/web-core@0.26.0'
  - '@lynx-js/web-elements@0.12.10'
  - '@lynx-js/web-rsbuild-server-middleware@0.26.0'
  - '@lynx-js/web-worker-rpc@0.26.0'
  - '@lynx-js/webpack-runtime-globals@0.0.8'
  - '@module-federation/bridge-react-webpack-plugin@2.9.0'
  - '@module-federation/cli@2.9.0'
  - '@module-federation/dts-plugin@2.9.0'
  - '@module-federation/enhanced@2.9.0'
  - '@module-federation/error-codes@2.9.0'
  - '@module-federation/inject-external-runtime-core-plugin@2.9.0'
  - '@module-federation/managers@2.9.0'
  - '@module-federation/manifest@2.9.0'
  - '@module-federation/metro@2.9.0'
  - '@module-federation/node@2.7.50'
  - '@module-federation/rsbuild-plugin@2.9.0'
  - '@module-federation/rspack@2.9.0'
  - '@module-federation/runtime-core@2.9.0'
  - '@module-federation/runtime-tools@2.9.0'
  - '@module-federation/runtime@2.9.0'
  - '@module-federation/sdk@2.9.0'
  - '@module-federation/third-party-dts-extractor@2.9.0'
  - '@module-federation/webpack-bundler-runtime@2.9.0'
# no git/tarball dependencies, only from trusted registry
blockExoticSubdeps: true

auditConfig:
